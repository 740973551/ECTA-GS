[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecta-gs"
version = "0.1.1"
description = "早期中国木构建筑资料工作台"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "SQLAlchemy>=2,<3", "alembic>=1.13,<2", "platformdirs>=4", "PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "ezdxf>=1.3,<2", "charset-normalizer>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecta-gs = "ecta_gs.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecta_gs = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
